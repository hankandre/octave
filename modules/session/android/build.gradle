// The session module of decision 0005 (T3-03): the one authenticated OkHttp client. Its HTTP package is plain Kotlin,
// so its tests run on the JVM with no Android class. The versions are fixed pins; docs/specs/T3-03.md, "Dependencies",
// holds their maintenance check.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.octave'
version = '0.1.0'

def okhttpVersion = '5.5.1'
def kotlinxSerializationJsonVersion = '1.9.0'
def junitBom = 'org.junit:junit-bom:6.1.3'

// The probe reads the shared host-class vectors from its test APK's assets; only that one fixture is copied.
def octaveProbeAssets = layout.buildDirectory.dir("generated/octave-probe-assets").get().asFile
def copyOctaveProbeAssets = tasks.register("copyOctaveProbeAssets", Sync) {
  from(file("../../../packages/core/tests/fixtures/host-classes.json"))
  into(octaveProbeAssets)
}
tasks.matching { it.name.endsWith("AndroidTestAssets") }.configureEach { dependsOn(copyOctaveProbeAssets) }

// T3-33: the hosts a development build may sign in to beside loopback and 10.0.2.2, from the build machine's
// environment (docs/commands.md). Only the debug build type reads it; every other build type holds the empty string.
// The value may hold only host characters, so no quote or backslash reaches the generated source.
def octaveDevServers = providers.environmentVariable("OCTAVE_DEV_SERVERS").getOrElse("")
if (!(octaveDevServers ==~ /[A-Za-z0-9._\-:\[\], ]*/)) {
  throw new GradleException("The environment variable OCTAVE_DEV_SERVERS holds a character that is not part of a host list.")
}

android {
  namespace "dev.octave.session"
  buildFeatures {
    buildConfig true
  }
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    buildConfigField "String", "OCTAVE_DEV_SERVERS", '""'
    // The device probe of T3-15 is a bare Instrumentation in src/androidTest: no test runner dependency.
    testInstrumentationRunner "dev.octave.session.devicecheck.CleartextProbe"
  }
  buildTypes {
    debug {
      buildConfigField "String", "OCTAVE_DEV_SERVERS", "\"${octaveDevServers}\""
    }
  }
  sourceSets {
    androidTest.assets.srcDir(octaveProbeAssets)
  }
  testOptions {
    // The probe's test APK targets what the app targets: expo-root-project sets rootProject.ext.targetSdkVersion, and
    // the app's build.gradle reads the same property. No default: below API 28 Android permits cleartext anyway, and
    // the probe would prove nothing (docs/specs/T3-15.md).
    targetSdk rootProject.ext.targetSdkVersion
    unitTests.all {
      useJUnitPlatform()
      // modules/session/android is three levels below the repository; canonicalPath resolves a node_modules symlink.
      systemProperty "octave.repoRoot", file("../../..").canonicalPath
    }
  }
}

dependencies {
  // The BOM moves every OkHttp artifact in the APK to one version, so React Native's okhttp-urlconnection (its cookie
  // jar) is 5.5.1 beside okhttp 5.5.1; at 4.9.2 it calls a class OkHttp 5 removed (apps/tv/native CookieJarLinkTest).
  implementation platform("com.squareup.okhttp3:okhttp-bom:${okhttpVersion}")
  implementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"
  // T3-05: sign-in builds and parses JSON, and the token filter reads parsed strings. Tree API only, no compiler plugin.
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${kotlinxSerializationJsonVersion}"

  testImplementation "com.squareup.okhttp3:mockwebserver3:${okhttpVersion}"
  testImplementation platform(junitBom)
  testImplementation "org.junit.jupiter:junit-jupiter"
  testImplementation "org.junit.jupiter:junit-jupiter-params"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

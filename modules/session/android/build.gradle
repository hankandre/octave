// The session module of decision 0005 (T3-03): the one authenticated OkHttp client. Its HTTP package is plain Kotlin,
// so its tests run on the JVM with no Android class. The versions are fixed pins; docs/specs/T3-03.md, "Dependencies",
// holds their maintenance check.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.octave'
version = '0.1.0'

def okhttpVersion = '5.5.1'
def kotlinxSerializationJsonVersion = '1.9.0'
def junitBom = 'org.junit:junit-bom:6.1.3'

android {
  namespace "dev.octave.session"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests.all {
      useJUnitPlatform()
      // modules/session/android is three levels below the repository; canonicalPath resolves a node_modules symlink.
      systemProperty "octave.repoRoot", file("../../..").canonicalPath
    }
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"

  testImplementation "com.squareup.okhttp3:mockwebserver3:${okhttpVersion}"
  testImplementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${kotlinxSerializationJsonVersion}"
  testImplementation platform(junitBom)
  testImplementation "org.junit.jupiter:junit-jupiter"
  testImplementation "org.junit.jupiter:junit-jupiter-params"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// The artwork module (T3-11): one native image view over a plain-Kotlin loader (load/). Every image request goes
// through the session module's ArtworkFetch, so this module declares no HTTP library of its own. Decoding uses the
// platform's BitmapFactory; no image loader is adopted (docs/specs/T3-11.md, "Dependencies"). kotlinx.coroutines
// comes through expo-modules-core. The JUnit BOM is the pin modules/session uses.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.octave'
version = '0.1.0'

def junitBom = 'org.junit:junit-bom:6.1.3'

android {
  namespace "dev.octave.artwork"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests.all {
      useJUnitPlatform()
      // modules/artwork/android is three levels below the repository; canonicalPath resolves a node_modules symlink.
      systemProperty "octave.repoRoot", file("../../..").canonicalPath
    }
  }
}

dependencies {
  implementation project(':octave-session')

  testImplementation platform(junitBom)
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// The player module: the PlayerEngine port's seam (T8-01) and its Media3 engine (T8-02). The seam and engine/
// packages are plain Kotlin, so their tests run on the JVM with no Android class. It takes SessionId, the registry's
// held-or-not answer and the one client's call factory from the session module. Media3 1.11.1 is the newest stable
// (docs/specs/T8-02.md, "Dependencies"); only ExoPlayer and its OkHttp data source are adopted, and the OkHttp BOM
// holds every OkHttp artifact at the session module's pin. The JUnit BOM is the pin modules/session uses.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.octave'
version = '0.1.0'

def media3Version = '1.11.1'
def okhttpVersion = '5.5.1'
def junitBom = 'org.junit:junit-bom:6.1.3'

android {
  namespace "dev.octave.player"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests.all {
      useJUnitPlatform()
      // modules/player/android is three levels below the repository; canonicalPath resolves a node_modules symlink.
      systemProperty "octave.repoRoot", file("../../..").canonicalPath
    }
  }
}

dependencies {
  implementation project(':octave-session')
  implementation platform("com.squareup.okhttp3:okhttp-bom:${okhttpVersion}")
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-datasource-okhttp:${media3Version}"

  testImplementation platform(junitBom)
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

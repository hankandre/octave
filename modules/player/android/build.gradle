// The player module of T8-01: the PlayerEngine port's seam. Its seam package is plain Kotlin, so its tests run on the
// JVM with no Android class. No engine and no player library yet (T8-02 adopts one). It takes SessionId and the
// registry's held-or-not answer from the session module; the JUnit BOM is the pin modules/session uses.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.octave'
version = '0.1.0'

def junitBom = 'org.junit:junit-bom:6.1.3'

android {
  namespace "dev.octave.player"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests.all {
      useJUnitPlatform()
      // modules/player/android is three levels below the repository; canonicalPath resolves a node_modules symlink.
      systemProperty "octave.repoRoot", file("../../..").canonicalPath
    }
  }
}

dependencies {
  implementation project(':octave-session')

  testImplementation platform(junitBom)
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

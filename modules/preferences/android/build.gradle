// The preferences record store of T9-02: one file in the app's no-backup directory. Its store package is plain Kotlin,
// so its tests run on the JVM with no Android class. No implementation dependency: storage is the platform's
// (docs/specs/T9-02.md, "Dependencies"). The JUnit BOM is the pin modules/session and modules/install-id use.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.octave'
version = '0.1.0'

def junitBom = 'org.junit:junit-bom:6.1.3'

android {
  namespace "dev.octave.preferences"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests.all {
      useJUnitPlatform()
      // modules/preferences/android is three levels below the repository; canonicalPath resolves a node_modules symlink.
      systemProperty "octave.repoRoot", file("../../..").canonicalPath
    }
  }
}

dependencies {
  testImplementation platform(junitBom)
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

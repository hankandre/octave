name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  # Basic repository checks until the apps bring their own.
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No signing keys or env files are committed
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env$|\.(jks|keystore|p12|pk8)$|(^|/)signing[^/]*\.properties$' || true)
          if [ -n "$found" ]; then
            echo "Remove these files from the repository:"
            echo "$found"
            exit 1
          fi
      - name: Relative links in Markdown resolve
        run: |
          status=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            for target in $(grep -oE '\]\([^)#[:space:]]+' "$file" | sed 's/^](//' | grep -vE '^[a-z]+:'); do
              if [ ! -e "$dir/$target" ]; then
                echo "$file: broken link to $target"
                status=1
              fi
            done
          done < <(git ls-files '*.md')
          exit $status

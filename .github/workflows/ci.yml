name: ci

on:
  push:
    branches: [main]
  pull_request:
    # edited: a changed base branch reruns the device-job skip decision against the new base (T1-17 review).
    types: [opened, synchronize, reopened, edited]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Decides whether the device jobs (tripwire, tv, wire) run (T1-17). Only a pull
  # request whose every changed path is under docs/ or tasks/ gives "skip". A push,
  # a merge group, an unreadable diff and a failure of this job all leave the output
  # empty or "run", and the three jobs then run.
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      device-jobs: ${{ steps.decide.outputs.device-jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit and both parents
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          node-version-file: .node-version
      - id: decide
        if: github.event_name == 'pull_request'
        env:
          OCTAVE_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-device-jobs.mjs

  # The core's checks: the same steps as `pnpm check`, in its order
  # (scripts/ci-check-parity.test.ts fails when they drift).
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # pnpm lint:flow reads the history back to origin/main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm lint:boundaries
      - run: pnpm lint
      - run: pnpm lint:network
      - run: pnpm lint:logs
      - run: pnpm lint:ghost-terms
      - run: pnpm lint:flow
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm test:workflow

  # Server conversion tripwire: plays every synthetic sample through the core's
  # gateway against the pinned Jellyfin 10.11, Jellyfin 12.4 and Jellyscale
  # fixture (Jellyscale is built from its pinned commit). Playable samples
  # must direct play with no server job; the BluRay folder, the ISO, and a
  # forced-limit run must convert over same-origin, credential-free HLS, agree
  # with /Sessions, and leave no job after the stop. Three capability sets each
  # lacking one video codec must convert it on Jellyfin and be refused on
  # Jellyscale. Every request must carry the header and no credential
  # parameter. Required on main by ruleset 26769544. Skipped on a pull request
  # that changes only docs/ or tasks/ (the changes job; a skipped job reports success).
  tripwire:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.device-jobs != 'skip' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 22.04's ffmpeg lacks libsvtav1, so the samples are generated with
      # the jellyfin-ffmpeg build that ships in the pinned fixture image.
      - name: Generate samples with jellyfin-ffmpeg
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e PATH=/usr/lib/jellyfin-ffmpeg:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --entrypoint bash jellyfin/jellyfin:10.11.7 scripts/generate-samples.sh
      # The dvdsub and ISO samples need python3 and xorriso, which the Jellyfin
      # image lacks. The script skips the samples made above and builds only
      # these two on the host, with packages from the pinned Ubuntu snapshot.
      - name: Generate conversion-only samples on the host
        env:
          OCTAVE_CONVERSION_SAMPLES: "1"
        run: |
          sudo bash scripts/configure-ubuntu-snapshot.sh
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades ffmpeg xorriso
          python3 --version
          bash scripts/generate-samples.sh
      - run: pnpm fixture:up
      # Setup output, stderr included, must hold no password.
      - name: Set up the fixture servers
        run: |
          set -o pipefail
          pnpm fixture:setup 2>&1 | node tests/integration/check-no-secret.mjs
      - run: pnpm fixture:check-jellyscale
      # The tripwire starts the library scan and waits for the servers to go quiet.
      - run: pnpm test:tripwire
        env:
          OCTAVE_CONVERSION_SAMPLES: "1"
      - name: Upload tripwire log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tripwire-log
          path: release-evidence/tripwire/
          if-no-files-found: warn
      - name: Stop fixture
        if: always()
        run: pnpm fixture:down

  # The TV app (T3-01): a release APK from a clean checkout (apps/tv/android is
  # generated by prebuild, never committed), its JVM tests, its badging, and the
  # first-focus smoke test on an Android TV emulator. T3-02 adds the e2e APK and
  # the device test (pnpm tv:e2e: the core's conformance suites under Hermes),
  # in a second emulator boot so the first one still tests the uploaded APK.
  # Required on main by ruleset 26769544 since 2026-11-21 (T3-02, owner-approved).
  # Skipped on a pull request that changes only docs/ or tasks/ (the changes job). An
  # emulator step whose script never started is run once more; a started script never is.
  tv:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.device-jobs != 'skip' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm tv:prebuild
      - run: pnpm tv:native:test
      - run: pnpm tv:build
      - run: pnpm tv:apk:check
      - name: Upload the release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: octave-tv-release-apk
          path: apps/tv/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # The udev rule from android-emulator-runner's README. Software emulation
      # is never a silent fallback: no /dev/kvm fails here.
      - name: Enable KVM
        run: |
          test -e /dev/kvm || { echo "ERROR tv: /dev/kvm is missing on this runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # T1-17: a pnpm shim, first on PATH, creates the file an emulator step names in
      # OCTAVE_CI_SCRIPT_STARTED before it starts the real pnpm. A first attempt that
      # fails with no such file never reached its script, and is run once more.
      - name: Mark when an emulator step's script starts
        run: |
          real="$(command -v pnpm)"
          mkdir -p "$RUNNER_TEMP/octave-ci/bin" "$RUNNER_TEMP/octave-ci/started"
          install -m 755 scripts/ci-script-started.sh "$RUNNER_TEMP/octave-ci/bin/pnpm"
          echo "OCTAVE_CI_REAL_PNPM=$real" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/octave-ci/bin" >> "$GITHUB_PATH"
      - name: First focus on an Android TV emulator
        id: smoke
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SERIAL: emulator-5554
          OCTAVE_CI_SCRIPT_STARTED: ${{ runner.temp }}/octave-ci/started/smoke
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-port: 5554
          disable-linux-hw-accel: false
          script: pnpm tv:smoke
      - name: Fail, or allow one more first-focus run if its script never started
        id: smoke-retry
        if: steps.smoke.outcome != 'success'
        env:
          OCTAVE_CI_STEP_OUTCOME: ${{ steps.smoke.outcome }}
          OCTAVE_CI_SCRIPT_STARTED: ${{ runner.temp }}/octave-ci/started/smoke
        run: node scripts/ci-emulator-retry.mjs
      - name: First focus on an Android TV emulator, once more
        if: steps.smoke-retry.outputs.retry == 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-port: 5554
          disable-linux-hw-accel: false
          script: pnpm tv:smoke
      - run: pnpm tv:e2e:build
      - name: Conformance under Hermes on an Android TV emulator
        id: e2e
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SERIAL: emulator-5554
          OCTAVE_CI_SCRIPT_STARTED: ${{ runner.temp }}/octave-ci/started/e2e
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-port: 5554
          disable-linux-hw-accel: false
          script: pnpm tv:e2e
      - name: Fail, or allow one more conformance run if its script never started
        id: e2e-retry
        if: steps.e2e.outcome != 'success'
        env:
          OCTAVE_CI_STEP_OUTCOME: ${{ steps.e2e.outcome }}
          OCTAVE_CI_SCRIPT_STARTED: ${{ runner.temp }}/octave-ci/started/e2e
        run: node scripts/ci-emulator-retry.mjs
      - name: Conformance under Hermes on an Android TV emulator, once more
        if: steps.e2e-retry.outputs.retry == 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-port: 5554
          disable-linux-hw-accel: false
          script: pnpm tv:e2e
      - name: Upload the focus and conformance transcripts, first-screen screenshot and JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: octave-tv-evidence
          path: |
            release-evidence/tv/
            apps/tv/android/app/build/test-results/
          if-no-files-found: warn

  # The wire tests (T3-05, pnpm tv:wire): the e2e app on an Android TV emulator
  # signs in and calls through the session module's one OkHttp client, against a
  # local mock and the pinned Jellyfin 10.11, Jellyfin 12.4 and Jellyscale
  # fixture, each through a recorder that keeps no header, query value or body.
  # The run sets the emulator's global http_proxy to a listener of its own and
  # judges the captures, the app's lines and the whole logcat dump. Its
  # release-evidence/wire/summary.txt is T3-05 item 7's evidence. Not a required
  # check until T10-01; the T3-05 pull request is held until it is green. Skipped on
  # a pull request that changes only docs/ or tasks/; its emulator step is retried
  # like the tv job's (only when its script never started).
  wire:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.device-jobs != 'skip' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm tv:prebuild
      - run: pnpm tv:e2e:build
      # fixture:setup waits for each library scan, which never settles on an
      # empty library, so the playable samples are generated as the tripwire job
      # does. The wire tests read no media.
      - name: Generate samples with jellyfin-ffmpeg
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e PATH=/usr/lib/jellyfin-ffmpeg:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --entrypoint bash jellyfin/jellyfin:10.11.7 scripts/generate-samples.sh
      - run: pnpm fixture:up
      # Setup output, stderr included, must hold no password.
      - name: Set up the fixture servers
        run: |
          set -o pipefail
          pnpm fixture:setup 2>&1 | node tests/integration/check-no-secret.mjs
      # The udev rule from android-emulator-runner's README. Software emulation
      # is never a silent fallback: no /dev/kvm fails here.
      - name: Enable KVM
        run: |
          test -e /dev/kvm || { echo "ERROR wire: /dev/kvm is missing on this runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # T1-17: a pnpm shim, first on PATH, creates the file an emulator step names in
      # OCTAVE_CI_SCRIPT_STARTED before it starts the real pnpm. A first attempt that
      # fails with no such file never reached its script, and is run once more.
      - name: Mark when an emulator step's script starts
        run: |
          real="$(command -v pnpm)"
          mkdir -p "$RUNNER_TEMP/octave-ci/bin" "$RUNNER_TEMP/octave-ci/started"
          install -m 755 scripts/ci-script-started.sh "$RUNNER_TEMP/octave-ci/bin/pnpm"
          echo "OCTAVE_CI_REAL_PNPM=$real" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/octave-ci/bin" >> "$GITHUB_PATH"
      - name: Wire tests on an Android TV emulator
        id: wire
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SERIAL: emulator-5554
          OCTAVE_CI_SCRIPT_STARTED: ${{ runner.temp }}/octave-ci/started/wire
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-port: 5554
          disable-linux-hw-accel: false
          script: pnpm tv:wire
      - name: Fail, or allow one more wire-test run if its script never started
        id: wire-retry
        if: steps.wire.outcome != 'success'
        env:
          OCTAVE_CI_STEP_OUTCOME: ${{ steps.wire.outcome }}
          OCTAVE_CI_SCRIPT_STARTED: ${{ runner.temp }}/octave-ci/started/wire
        run: node scripts/ci-emulator-retry.mjs
      - name: Wire tests on an Android TV emulator, once more
        if: steps.wire-retry.outputs.retry == 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-port: 5554
          disable-linux-hw-accel: false
          script: pnpm tv:wire
      - name: Upload the wire evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: octave-wire-evidence
          path: release-evidence/wire/
          if-no-files-found: warn
      - name: Stop fixture
        if: always()
        run: pnpm fixture:down

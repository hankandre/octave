name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # The core's checks: the same steps as `pnpm check`, in its order
  # (scripts/ci-check-parity.test.ts fails when they drift).
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # pnpm lint:flow reads the history back to origin/main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm lint:boundaries
      - run: pnpm lint
      - run: pnpm lint:ghost-terms
      - run: pnpm lint:flow
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm test:workflow

  # Server conversion tripwire: plays every synthetic sample through the core's
  # gateway against the pinned Jellyfin 10.11, Jellyfin 12.4 and Jellyscale
  # fixture (Jellyscale is built from its pinned commit). Playable samples
  # must direct play with no server job; the BluRay folder, the ISO, and a
  # forced-limit run must convert over same-origin, credential-free HLS, agree
  # with /Sessions, and leave no job after the stop. Three capability sets each
  # lacking one video codec must convert it on Jellyfin and be refused on
  # Jellyscale. Every request must carry the header and no credential
  # parameter. Required on main by ruleset 26769544.
  tripwire:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 22.04's ffmpeg lacks libsvtav1, so the samples are generated with
      # the jellyfin-ffmpeg build that ships in the pinned fixture image.
      - name: Generate samples with jellyfin-ffmpeg
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e PATH=/usr/lib/jellyfin-ffmpeg:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --entrypoint bash jellyfin/jellyfin:10.11.7 scripts/generate-samples.sh
      # The dvdsub and ISO samples need python3 and xorriso, which the Jellyfin
      # image lacks. The script skips the samples made above and builds only
      # these two on the host, with packages from the pinned Ubuntu snapshot.
      - name: Generate conversion-only samples on the host
        env:
          OCTAVE_CONVERSION_SAMPLES: "1"
        run: |
          sudo bash scripts/configure-ubuntu-snapshot.sh
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades ffmpeg xorriso
          python3 --version
          bash scripts/generate-samples.sh
      - run: pnpm fixture:up
      # Setup output, stderr included, must hold no password.
      - name: Set up the fixture servers
        run: |
          set -o pipefail
          pnpm fixture:setup 2>&1 | node tests/integration/check-no-secret.mjs
      - run: pnpm fixture:check-jellyscale
      # The tripwire starts the library scan and waits for the servers to go quiet.
      - run: pnpm test:tripwire
        env:
          OCTAVE_CONVERSION_SAMPLES: "1"
      - name: Upload tripwire log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tripwire-log
          path: release-evidence/tripwire/
          if-no-files-found: warn
      - name: Stop fixture
        if: always()
        run: pnpm fixture:down

  # The TV app (T3-01): a release APK from a clean checkout (apps/tv/android is
  # generated by prebuild, never committed), its JVM tests, its badging, and the
  # first-focus smoke test on an Android TV emulator. T3-02 adds the e2e APK and
  # the device test (pnpm tv:e2e: the core's conformance suites under Hermes),
  # in a second emulator boot so the first one still tests the uploaded APK. A
  # required check from T3-02 on (ruleset 26769544).
  tv:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm tv:prebuild
      - run: pnpm tv:native:test
      - run: pnpm tv:build
      - run: pnpm tv:apk:check
      - name: Upload the release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: octave-tv-release-apk
          path: apps/tv/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # The udev rule from android-emulator-runner's README. Software emulation
      # is never a silent fallback: no /dev/kvm fails here.
      - name: Enable KVM
        run: |
          test -e /dev/kvm || { echo "ERROR tv: /dev/kvm is missing on this runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: First focus on an Android TV emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-port: 5554
          disable-linux-hw-accel: false
          script: pnpm tv:smoke
      - run: pnpm tv:e2e:build
      - name: Conformance under Hermes on an Android TV emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-port: 5554
          disable-linux-hw-accel: false
          script: pnpm tv:e2e
      - name: Upload the focus and conformance transcripts, first-screen screenshot and JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: octave-tv-evidence
          path: |
            release-evidence/tv/
            apps/tv/android/app/build/test-results/
          if-no-files-found: warn

<!doctype html>
<meta charset="utf-8">
<title>T4-06 mockups</title>
<!-- Open as mockups.html?m=<name>, 1920x1080. Values are DESIGN.md §8 in canvas px. Local files only; needs `pnpm install` for the icon font.
     All names, servers, addresses and art are invented. -->
<style>
@font-face { font-family: ui; src: url(../../../../apps/tv/assets/fonts/AtkinsonHyperlegibleNext.ttf); font-weight: 200 800; }
@font-face { font-family: tabler; src: url(../../../../node_modules/.pnpm/@tabler+icons-webfont@3.52.0/node_modules/@tabler/icons-webfont/dist/fonts/tabler-icons-300.ttf); }
:root { --surface0:#0b0c0e; --surface1:#131417; --surface2:#1b1c20; --surface3:#25262b; --text1:#f2efe9; --text2:#a9a59d; --text3:#8a867f;
  --focus:#fff4dc; --lineStrong:rgb(242 239 233/.37); --fillSecondary:rgb(242 239 233/.12); --brass:#e8c48a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width:1920px; height:1080px; overflow:hidden; position:relative; background:var(--surface0); color:var(--text1); font:400 28px/1.5 ui; }
.abs { position:absolute; }
.ic { font-family:tabler; font-style:normal; font-weight:400; line-height:1; }
.ring::after { content:""; position:absolute; inset:calc(-6px - var(--bw,0px)); border:3px solid var(--focus); border-radius:calc(var(--r) + 6px);
  box-shadow:0 0 0 1px rgb(0 0 0/.6); }

/* Account picker */
.picker { position:absolute; inset:54px 96px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:64px; }
.picker.left { align-items:flex-start; justify-content:flex-start; inset:54px 0 54px 96px; }
h1 { font:650 48px/1.15 ui; }
.tiles { display:flex; flex-wrap:wrap; justify-content:center; gap:48px 24px; width:1608px; }
.left .tiles { justify-content:flex-start; }
.tiles.strip { flex-wrap:nowrap; justify-content:flex-start; position:absolute; left:156px; top:390px; width:max-content; }
.tile { width:248px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.disc { --r:999px; position:relative; width:200px; height:200px; border-radius:999px; display:grid; place-items:center; background:var(--surface3);
  font:700 72px/1 ui; margin-bottom:24px; }
.disc .ic { font-size:72px; }
.out .disc { --bw:2px; background:transparent; border:2px solid var(--lineStrong); color:var(--text3); }
.add .disc { background:var(--fillSecondary); }
.focused .disc { transform:scale(1.08); }
.focused .disc { box-shadow:0 14px 32px -10px rgb(0 0 0/.65); }
.name { width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font:600 24px/1.3 ui; color:var(--text2); }
.focused .name { color:var(--text1); }
.server { width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font:500 24px/1.35 ui; color:var(--text3); }
.focused .server { color:var(--text2); }
.state { font:500 24px/1.35 ui; color:var(--text1); margin-top:8px; }

/* Rail (as built, T3-40) */
.rail { position:absolute; left:0; top:0; bottom:0; width:96px; z-index:2; }
.rail.open { width:400px; background:var(--surface1); }
.entry { --r:10px; position:absolute; left:16px; width:64px; height:64px; border-radius:10px; display:flex; align-items:center; color:var(--text2); font:600 24px/1.3 ui; white-space:nowrap; }
.open .entry { width:368px; }
.entry .cell { width:64px; display:grid; place-items:center; font-size:32px; }
.entry .cell b { font:600 24px/1.3 ui; }
.entry.current { color:var(--text1); }
.entry.current::before { content:""; position:absolute; left:0; top:12px; bottom:12px; width:4px; background:var(--text1); }
.entry.focused { background:var(--surface3); color:var(--text1); }

/* Buttons and the launch screens (as built, T4-05) */
.sheet { position:absolute; inset:54px 96px; display:flex; flex-direction:column; align-items:flex-start; gap:24px; }
.button { --r:10px; position:relative; height:72px; padding:0 32px; border-radius:10px; display:flex; align-items:center; font:600 24px/1.3 ui; }
.primary { background:var(--text1); color:#0b0c0e; }
.quiet { color:var(--text2); }
.button.focused { transform:scale(1.08); }

/* Home with invented art */
.art { position:absolute; border-radius:6px; }
</style>
<body></body>
<script>
const icons = { plus:"", user:"", search:"", home:"", movie:"", tv:"", settings:"" };
const icon = (name) => `<i class="ic">${icons[name]}</i>`;
const focusClass = (on) => (on ? "ring" : "");

function tile({ name, server, signedOut }, focused) {
  return `<div class="tile ${signedOut ? "out" : ""} ${focused ? "focused" : ""}">
    <div class="disc ${focusClass(focused)}">${Array.from(name)[0].toUpperCase()}</div>
    <div class="name">${name}</div><div class="server">${server}</div>${signedOut ? '<div class="state">Signed out</div>' : ""}</div>`;
}
const addTile = (focused) => `<div class="tile add ${focused ? "focused" : ""}"><div class="disc ${focusClass(focused)}">${icon("plus")}</div><div class="name">Add account</div></div>`;

/* `focus` is the tile index; accounts.length is the Add account tile; -1 is none. */
function picker(accounts, focus, variant = "centred") {
  const tiles = accounts.map((account, index) => tile(account, index === focus)).join("") + addTile(focus === accounts.length);
  if (variant === "strip") {
    return `<h1 class="abs" style="left:156px;top:276px">Who's watching?</h1><div class="tiles strip" style="left:${focus > 5 ? -((focus - 5) * 272) + 156 : 156}px">${tiles}</div>`;
  }
  return `<div class="picker ${variant === "left" ? "left" : ""}"><h1>Who's watching?</h1><div class="tiles">${tiles}</div></div>`;
}

function rail({ open = false, current = "home", focused }) {
  const entry = (key, top, glyph, label) => `<div class="entry ${current === key ? "current" : ""} ${focused === key ? "focused ring" : ""}" style="top:${top}px">
    <span class="cell">${glyph}</span>${open ? `<span>${label}</span>` : ""}</div>`;
  return `<div class="rail ${open ? "open" : ""}">${entry("search", 16, icon("search"), "Search")}${entry("home", 88, icon("home"), "Home")}
    ${entry("movies", 160, icon("movie"), "Movies")}${entry("shows", 232, icon("tv"), "Shows")}
    ${entry("settings", 928, icon("settings"), "Settings")}${entry("account", 1000, "<b>J</b>", "Juniper")}</div>`;
}

const hues = [[28, 200], [190, 250], [345, 40], [140, 90], [260, 320], [55, 15], [215, 160]];
const art = (index, x, y, w, h) => { const [from, to] = hues[index % hues.length];
  return `<div class="art" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:
    radial-gradient(circle at ${25 + index * 11 % 60}% 38%, hsl(${to} 55% 62%/.85) 0 11%, transparent 12%),
    linear-gradient(${150 + index * 23}deg, hsl(${from} 45% 38%), hsl(${to} 40% 12%))"></div>`; };

function home({ heroFocused }) {
  const thumbs = [0, 1, 2, 3].map((n) => art(n + 1, 120 + n * 440, 502, 416, 234)).join("");
  const posters = [0, 1, 2, 3, 4, 5, 6].map((n) => art(n + 3, 120 + n * 272, 920, 248, 372)).join("");
  return `<div class="abs" style="inset:0;opacity:.35;background:radial-gradient(circle at 72% 34%, hsl(200 60% 60%) 0 9%, hsl(215 45% 30%) 28%, transparent 62%)"></div>
    <div class="abs" style="left:120px;top:60px;font:700 72px/1.02 ui;letter-spacing:-.02em">The Paper Orchard</div>
    <div class="abs" style="left:120px;top:144px;font:500 24px/1.35 ui;color:var(--text2)">S1 · E4 · 22 min left</div>
    <div class="abs" style="left:120px;top:317px;display:flex;gap:16px"><div class="button primary ${heroFocused ? "focused ring" : ""}">Resume</div><div class="button" style="background:var(--fillSecondary)">More info</div></div>
    <div class="abs" style="left:120px;top:438px;font:600 33px/1.25 ui">Continue watching</div>${thumbs}
    <div class="abs" style="left:120px;top:862px;font:600 33px/1.25 ui">Recently added</div>${posters}`;
}

const loading = () => `<div class="abs" style="left:96px;top:54px">Loading…</div>`;
const unreachable = (secondLabel) => `<div class="sheet"><div>Couldn't reach https://media.example.test. Check the address and that the server is running.</div>
  <div class="button primary focused ring">Try again</div><div class="button quiet">${secondLabel}</div></div>`;

const juniper = { name: "Juniper", server: "Lantern Loft" };
const okapi = { name: "Okapi", server: "Lantern Loft" };
const pip = { name: "Pip", server: "Cedar Shed", signedOut: true };
const two = [juniper, okapi];
const withSignedOut = [juniper, okapi, pip];
const many = [juniper, okapi, { name: "Bartholomew Featherwick", server: "Lantern Loft" }, { name: "Juniper", server: "Cedar Shed" },
  { name: "Marigold", server: "The Upstairs Cupboard Server" }, pip, { name: "Quill", server: "Cedar Shed" }, { name: "Grandad's room", server: "Lantern Loft" }];

const screens = {
  "01-two-accounts": () => picker(two, 0),
  "02-focus-moved": () => picker(two, 1),
  "03-add-account-focused": () => picker(two, 2),
  "04-signed-out-not-focused": () => picker(withSignedOut, 0),
  "05-signed-out-focused": () => picker(withSignedOut, 2),
  "06-many-wrapped": () => picker(many, 3),
  "07-many-wrapped-second-row": () => picker(many, 7),
  "08-alt-many-one-row": () => picker(many, 7, "strip"),
  "09-alt-left-aligned": () => picker(withSignedOut, 0, "left"),
  "10-launch-one-account-checking": loading,
  "11-launch-one-account-home": () => rail({}) + home({ heroFocused: true }),
  "12-rail-account-entry": () => home({}) + rail({ open: true, current: "home", focused: "account" }),
  "13-picker-from-rail": () => rail({ current: "account" }) + picker(withSignedOut, 0),
  "14-picker-back-opens-rail": () => picker(withSignedOut, -1) + rail({ open: true, current: "account", focused: "account" }),
  "15-switching": loading,
  // 16-switch-failed.png is drawn by ../full-screen-states/mockups.html?m=06-switch-failed.
  "17-alt-switch-failed-as-built": () => unreachable("Change server"),
};
document.body.innerHTML = screens[new URLSearchParams(location.search).get("m") ?? "01-two-accounts"]();
</script>

<!doctype html>
<meta charset="utf-8">
<title>Full-screen message states</title>
<!-- Open as mockups.html?m=<name>, 1920x1080. Values are DESIGN.md §8 in canvas px. Local files only; needs `pnpm install` for the icon font.
     All names, addresses and art are invented. -->
<style>
@font-face { font-family: ui; src: url(../../../../apps/tv/assets/fonts/AtkinsonHyperlegibleNext.ttf); font-weight: 200 800; }
@font-face { font-family: mono; src: url(../../../../apps/tv/assets/fonts/AtkinsonHyperlegibleMono.ttf); font-weight: 200 800; }
@font-face { font-family: tabler; src: url(../../../../node_modules/.pnpm/@tabler+icons-webfont@3.52.0/node_modules/@tabler/icons-webfont/dist/fonts/tabler-icons-300.ttf); }
:root { --void:#060708; --surface0:#0b0c0e; --surface1:#131417; --surface3:#25262b; --text1:#f2efe9; --text2:#a9a59d; --text3:#8a867f; --notice:#f0b65a;
  --focus:#fff4dc; --fillSecondary:rgb(242 239 233/.12); }
* { box-sizing:border-box; margin:0; padding:0; }
body { width:1920px; height:1080px; overflow:hidden; position:relative; background:var(--surface0); color:var(--text1); font:400 28px/1.5 ui; }
.abs { position:absolute; }
.ic { font-family:tabler; font-style:normal; font-weight:400; line-height:1; }
.ring::after { content:""; position:absolute; inset:-6px; border:3px solid var(--focus); border-radius:calc(var(--r) + 6px); box-shadow:0 0 0 1px rgb(0 0 0/.6); }

/* The one pattern: fixed tops, centred on the screen. */
.slot { position:absolute; left:96px; right:96px; display:flex; justify-content:center; text-align:center; }
.mark { top:232px; height:96px; align-items:center; font-size:72px; color:var(--notice); }
.mark.neutral { color:var(--text2); }
.title { top:360px; font:650 48px/1.15 ui; }
.sentence { top:439px; }
.sentence p { max-width:840px; text-wrap:balance; font:400 31.5px/1.55 ui; color:var(--text2); }
.server { top:569px; flex-direction:column; align-items:center; }
.server > div { max-width:840px; }
.server .name { max-width:840px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font:600 33px/1.25 ui; }
.server .address { font:500 24px/1.3 mono; color:var(--text2); overflow-wrap:anywhere; margin-top:8px; }
.actions { top:744px; gap:32px; }
.actions.high { top:582px; }
.button { --r:10px; position:relative; height:72px; padding:0 32px; border-radius:10px; display:flex; align-items:center; font:600 24px/1.3 ui; background:var(--fillSecondary); white-space:nowrap; }
.button.primary { background:var(--text1); color:#0b0c0e; }
.button.focused { transform:scale(1.08); box-shadow:0 14px 32px -10px rgb(0 0 0/.65); }
.spinner { width:64px; height:64px; border-radius:50%; border:6px solid rgb(255 255 255/.22); border-top-color:var(--text1); transform:rotate(35deg); }

/* Option B */
.split { position:absolute; inset:54px 96px; display:flex; align-items:center; justify-content:center; gap:96px; }
.who { width:560px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:24px; padding-right:96px; border-right:1px solid rgb(242 239 233/.10); height:520px; justify-content:center; }
.what { width:800px; display:flex; flex-direction:column; align-items:flex-start; gap:24px; }

/* Rail, as built */
.rail { position:absolute; left:0; top:0; bottom:0; width:96px; }
.entry { position:absolute; left:16px; width:64px; height:64px; display:grid; place-items:center; font:32px/1 tabler; color:var(--text2); }
.entry.current { color:var(--text1); }
.entry.current::before { content:""; position:absolute; left:0; top:12px; bottom:12px; width:4px; background:var(--text1); }
.entry b { font:600 24px/1.3 ui; }
</style>
<body></body>
<script>
const icons = { offline:"", warning:"", question:"﯐", search:"", home:"", movie:"", tv:"", settings:"", back:"" };
const icon = (name) => `<i class="ic">${icons[name]}</i>`;

const button = (label, index, focus) => `<div class="button ${index === 0 ? "primary" : ""} ${index === focus ? "focused ring" : ""}">${label}</div>`;
const serverBlock = (server) => `<div class="slot server">${server.name ? `<div class="name">${server.name}</div>` : ""}<div class="address">${server.address}</div></div>`;

function state({ mark, neutral, title, sentence, server, actions = [], focus = 0, loading }) {
  return `<div class="slot mark ${neutral ? "neutral" : ""}">${loading ? '<div class="spinner"></div>' : icon(mark)}</div>
    <div class="slot title">${title}</div>
    ${sentence ? `<div class="slot sentence"><p>${sentence}</p></div>` : ""}
    ${server ? serverBlock(server) : ""}
    ${actions.length ? `<div class="slot actions ${server ? "" : "high"}">${actions.map((label, index) => button(label, index, focus)).join("")}</div>` : ""}`;
}

function rail(current) {
  const entry = (key, top, glyph) => `<div class="entry ${current === key ? "current" : ""}" style="top:${top}px">${glyph}</div>`;
  return `<div class="rail">${entry("search", 16, icons.search)}${entry("home", 88, icons.home)}${entry("movies", 160, icons.movie)}${entry("shows", 232, icons.tv)}
    ${entry("settings", 928, icons.settings)}${entry("account", 1000, "<b>J</b>")}</div>`;
}

const loft = { name:"Lantern Loft", address:"https://media.example.test" };
const long = { name:"The Upstairs Cupboard Media Server Behind the Winter Coats",
  address:"https://lantern-loft.upstairs-cupboard.home-media.example.test:8920/family/shared/jellyfin-server-with-a-long-base-path" };

const unreachable = { mark:"offline", title:"Can't reach the server", sentence:"Check that the server is on, then try again.", server:loft, actions:["Try again", "Change server"] };
const switchFailed = { ...unreachable, actions:["Try again", "Who's watching?"] };

const optionB = () => `<div class="split">
  <div class="who"><i class="ic" style="font-size:72px;color:var(--notice)">${icons.offline}</i>
    <div style="font:650 48px/1.15 ui">Lantern Loft</div><div style="font:500 24px/1.3 mono;color:var(--text2)">https://media.example.test</div></div>
  <div class="what"><div style="font:650 48px/1.15 ui">Can't reach the server</div>
    <div style="font:400 31.5px/1.55 ui;color:var(--text2);margin-bottom:32px">Check that the server is on, then try again.</div>
    <div class="button primary ring" style="width:420px;justify-content:center">Try again</div>
    <div class="button" style="width:420px;justify-content:center">Change server</div></div></div>`;

const screens = {
  "01-option-a-unreachable": () => state(unreachable),
  "02-option-b-unreachable": optionB,
  "03-loading": () => state({ loading:true, title:"Loading…", server:loft }),
  "04-unreachable-no-name": () => state({ ...unreachable, server:{ address:"https://media.example.test" } }),
  "05-second-action-focused": () => state({ ...unreachable, focus:1 }),
  "06-switch-failed": () => state(switchFailed),
  "07-redirect": () => state({ mark:"warning", title:"This address redirects elsewhere", sentence:"Octave doesn't follow redirects, so choose the server's final address.", server:loft, actions:["Change server", "Try again"] }),
  "08-unsupported-version": () => state({ mark:"warning", title:"This server needs an update", sentence:"Update it to Jellyfin 10.11 or newer, then try again.", server:loft, actions:["Try again", "Change server"] }),
  "09-anything-else": () => state({ mark:"warning", title:"Something went wrong", sentence:"Octave couldn't check your sign-in.", server:loft, actions:["Try again", "Change server"] }),
  "10-long-name-and-address": () => state({ ...unreachable, server:long }),
  "11-quick-connect-expired": () => state({ mark:"warning", title:"This code has expired", sentence:"Get a new code to try again.", server:loft, actions:["Get a new code", "Use a password", "Change server"] }),
  "12-quick-connect-unreachable": () => state({ mark:"offline", title:"Can't reach the server", sentence:"Check the address and that the server is running.", server:{ address:"http://192.168.1.5:8096", name:"Lantern Loft" }, actions:["Try again", "Use a password", "Change server"] }),
  "13-not-found": () => rail() + state({ mark:"question", neutral:true, title:"This page isn't available", sentence:"It may have moved, or this account can't see it.", actions:["Go home"] }),
  "14-home-unreachable": () => rail("home") + state({ ...unreachable, actions:["Retry"] }),
  "15-player-could-not-start": () => `<div class="abs" style="inset:0;opacity:.3;background:radial-gradient(circle at 70% 36%, hsl(32 70% 66%) 0 10%, hsl(350 40% 30%) 34%, hsl(220 40% 12%) 70%)"></div>
    <div class="abs" style="inset:0;background:linear-gradient(0deg, rgb(11 12 14/.92), rgb(11 12 14/.55))"></div>
    <div class="slot" style="top:162px;font:500 24px/1.35 ui;color:var(--text2)">The Paper Orchard</div>
    ${state({ mark:"offline", title:"Playback could not start", sentence:"Check that the server is on, then try again.", server:loft, actions:["Retry", "Back to details"] })}`,
};
const name = new URLSearchParams(location.search).get("m") ?? "01-option-a-unreachable";
document.body.innerHTML = screens[name]();
</script>
